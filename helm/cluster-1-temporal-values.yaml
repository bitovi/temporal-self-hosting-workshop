server:
  replicaCount: 1
  additionalEnv:
    - name: AWS_ACCESS_KEY_ID
      value: admin
    - name: AWS_SECRET_ACCESS_KEY
      value: temporal
  archival:
    history:
      state: "enabled"
      enableRead: true
      provider:
        s3store:
          region: us-east-1
          endpoint: "http://minio:9000"
          accessKey: admin
          secretKey: temporal
          insecure: true
          s3ForcePathStyle: true
    visibility:
      state: "enabled"
      enableRead: true
      provider:
        s3store:
          region: us-east-1
          endpoint: "http://minio:9000"
          accessKey: admin
          secretKey: temporal
          insecure: true
          s3ForcePathStyle: true

  config:
    numHistoryShards: 256
    persistence:
      default:
        driver: "sql"
        sql:
          driver: "postgres12"
          host: postgresql.default.svc.cluster.local
          port: 5432
          database: temporal_persistence
          user: temporal
          password: temporal
          maxConns: 20
          maxIdleConns: 20
          maxConnLifetime: "1h"
      visibility:
        driver: "sql"
        sql:
          driver: "postgres12"
          host: postgresql.default.svc.cluster.local
          port: 5432
          database: temporal_visibility
          user: temporal
          password: temporal
          maxConns: 20
          maxIdleConns: 20
          maxConnLifetime: "1h"
    clusterMetadata:
      enableGlobalNamespace: true
      failoverVersionIncrement: 10
      masterClusterName: "cluster-1"
      currentClusterName: "cluster-1"
      clusterInformation:
        cluster-1:
          enabled: true
          initialFailoverVersion: 1
          rpcAddress: "cluster-1-temporal-frontend:7233"
        cluster-2:
          enabled: true
          initialFailoverVersion: 2
          rpcAddress: "cluster-2-temporal-frontend:7233"  

  namespaceDefaults:
    archival:
      history:
        state: 'enabled'
        URI: 's3://temporal-archival/history'
      visibility:
        state: 'enabled'
        URI: 's3://temporal-visibility/visibility'

  frontend:
    service:
      type: NodePort
      port: 7233
      targetPort: 7233
      nodePort: 30233

  history:
    service:
      type: ClusterIP
      port: 7234
      targetPort: 7234

  matching:
    service:
      type: ClusterIP
      port: 7235
      targetPort: 7235

  worker:
    service:
      type: ClusterIP
      port: 7239
      targetPort: 7239

web:
  service:
    type: NodePort
    port: 8080
    targetPort: 8080
    nodePort: 30080
  

grafana:
  enabled: true
  service:
    type: NodePort
    port: 3000
    targetPort: 3000
    nodePort: 30000
  adminPassword: temporal
  dashboards:
    default:
      bitovi-expanded-dashboard-github:
        url: https://raw.githubusercontent.com/bitovi/Temporal-Self-Hosting-Workshop-Exercises/main/grafana/bitovi_expanded_dashboard.json
        datasource: TemporalMetrics
      benchmark-workshop-dashboard-github:
        url: https://raw.githubusercontent.com/bitovi/Temporal-Self-Hosting-Workshop-Exercises/main/grafana/benchmark_workshop_dashboard.json
        datasource: TemporalMetrics
      replication-dashboard-github:
        url: https://raw.githubusercontent.com/bitovi/Temporal-Self-Hosting-Workshop-Exercises/main/grafana/replication_dashboard.json
        datasource: TemporalMetrics
      server-general-github:
        url: https://raw.githubusercontent.com/temporalio/dashboards/helm/server/server-general.json
        datasource: TemporalMetrics
      sdk-general-github:
        url: https://raw.githubusercontent.com/temporalio/dashboards/helm/sdk/sdk-general.json
        datasource: TemporalMetrics
      misc-advanced-visibility-specific-github:
        url: https://raw.githubusercontent.com/temporalio/dashboards/helm/misc/advanced-visibility-specific.json
        datasource: TemporalMetrics
      misc-clustermonitoring-kubernetes-github:
        url: https://raw.githubusercontent.com/temporalio/dashboards/helm/misc/clustermonitoring-kubernetes.json
        datasource: TemporalMetrics
      misc-frontend-service-specific-github:
        url: https://raw.githubusercontent.com/temporalio/dashboards/helm/misc/frontend-service-specific.json
        datasource: TemporalMetrics
      misc-history-service-specific-github:
        url: https://raw.githubusercontent.com/temporalio/dashboards/helm/misc/history-service-specific.json
        datasource: TemporalMetrics
      misc-matching-service-specific-github:
        url: https://raw.githubusercontent.com/temporalio/dashboards/helm/misc/matching-service-specific.json
        datasource: TemporalMetrics
      misc-worker-service-specific-github:
        url: https://raw.githubusercontent.com/temporalio/dashboards/helm/misc/worker-service-specific.json
        datasource: TemporalMetrics
