# Deploys the codec-demo codec server + worker into the k3d cluster, the
# same way worker-control-ui is -- see _scripts/start.sh's
# ensure_codec_demo, which builds the image from this directory and
# `k3d image import`s it (it's local repo code, not published to a
# registry) before applying this file.
apiVersion: v1
kind: Secret
metadata:
  name: codec-demo-key
type: Opaque
stringData:
  # Static demo-only AES-256 key, base64-encoded. Shared by the worker
  # (encrypts/decrypts for real workflow execution) and the codec server
  # (decrypts for human viewing via the Web UI/CLI) so their ciphertexts
  # stay compatible. NOT suitable for production use.
  CODEC_AES_KEY: "cpJr5C9yXJD4iCP5AaejQQffGiS4/R39eKjFnDDTpJc="
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codec-server
  labels:
    app: codec-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codec-server
  template:
    metadata:
      labels:
        app: codec-server
    spec:
      containers:
        - name: codec-server
          image: codec-demo:local
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/codec-server"]
          ports:
            - name: http
              containerPort: 8091
          envFrom:
            - secretRef:
                name: codec-demo-key
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: codec-server
spec:
  type: NodePort
  selector:
    app: codec-server
  ports:
    - port: 8091
      targetPort: 8091
      nodePort: 30091
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codec-worker
  labels:
    app: codec-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codec-worker
  template:
    metadata:
      labels:
        app: codec-worker
    spec:
      containers:
        - name: codec-worker
          image: codec-demo:local
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/worker"]
          envFrom:
            - secretRef:
                name: codec-demo-key
