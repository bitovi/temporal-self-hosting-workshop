dashboards:
  default:
    # bitovi-temporal-dashboard and benchmark-workshop-dashboard (the two
    # dashboards this repo authors and maintains) are intentionally NOT
    # listed here. They're loaded from the local grafana/*.json files via
    # `helm ... --set-file` in _scripts/start.sh, not fetched from GitHub --
    # this avoids a silent-404 failure mode if this repo's local checkout is
    # ever ahead of what's pushed to GitHub. See start.sh for the exact keys.
    server-general-github:
      url: https://raw.githubusercontent.com/temporalio/dashboards/helm/server/server-general.json
      datasource: TemporalMetrics
    # Removed: sdk-general (client/SDK metrics, not server), and
    # misc-advanced-visibility-specific / misc-clustermonitoring-kubernetes
    # (neither reports Temporal server metrics, and both were already
    # silently failing to load -- 0-byte fetches from their GitHub URLs).
    misc-frontend-service-specific-github:
      url: https://raw.githubusercontent.com/temporalio/dashboards/helm/misc/frontend-service-specific.json
      datasource: TemporalMetrics
    misc-history-service-specific-github:
      url: https://raw.githubusercontent.com/temporalio/dashboards/helm/misc/history-service-specific.json
      datasource: TemporalMetrics
    misc-matching-service-specific-github:
      url: https://raw.githubusercontent.com/temporalio/dashboards/helm/misc/matching-service-specific.json
      datasource: TemporalMetrics
    misc-worker-service-specific-github:
      url: https://raw.githubusercontent.com/temporalio/dashboards/helm/misc/worker-service-specific.json
      datasource: TemporalMetrics

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

readinessProbe:
  httpGet:
    path: /api/health
    port: grafana

livenessProbe:
  httpGet:
    path: /api/health
    port: grafana
  initialDelaySeconds: 60
  timeoutSeconds: 30
  failureThreshold: 10

## Use an alternate scheduler, e.g. "stork".
## ref: https://kubernetes.io/docs/tasks/administer-cluster/configure-multiple-schedulers/
##
# schedulerName: "default-scheduler"

image:
  # -- The Docker registry
  registry: docker.io
  # -- Docker image repository
  repository: grafana/grafana
  # Overrides the Grafana image tag whose default is the chart appVersion
  tag: ""
  sha: ""
  pullPolicy: IfNotPresent

  ## Optionally specify an array of imagePullSecrets.
  ## Secrets must be manually created in the namespace.
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  ## Can be templated.
  ##
 # dns configuration for pod
hostUsers: ~
securityContext:
  runAsNonRoot: true
  runAsUser: 472
  runAsGroup: 472
  fsGroup: 472
# Enable creating the grafana configmap
createConfigmap: true

podPortName: grafana
gossipPortName: gossip
## Deployment annotations
# annotations: {}

## Expose the grafana service to be accessed from outside the cluster (LoadBalancer service).
## or access it from within the cluster (ClusterIP service). Set the service type and the port to serve it.
## ref: http://kubernetes.io/docs/user-guide/services/
##
service:
  enabled: true
  type: NodePort
  nodePort: 30000
  port: 3000
  targetPort: 3000
    # targetPort: 4181 To be used with a proxy extraContainer
  ## Service annotations. Can be templated.
  annotations: {}
  labels: {}
  portName: service
  # Adds the appProtocol field to the service. This allows to work with istio protocol selection. Ex: "http" or "tcp"
  appProtocol: ""
  sessionAffinity: ""
  # trafficDistribution allows specifying how traffic is distributed to Service endpoints.
  # Valid values: "" (default - standard load balancing),"PreferSameZone" (K8s 1.34+), "PreferSameNode" (K8s 1.35+), "PreferClose" (deprecated, use PreferSameZone),
  trafficDistribution: ""

serviceMonitor:
  ## If true, a ServiceMonitor CR is created for a prometheus operator
  ## https://github.com/coreos/prometheus-operator
  ##
  enabled: false
  path: /metrics
  #  namespace: monitoring  (defaults to use the namespace this chart is deployed to)
  labels: {}
  # Set these to override the Prometheus global scrape interval/timeout.
  # interval: 30s
  # scrapeTimeout: 30s
  scheme: http
  tlsConfig: {}
  relabelings: []
  metricRelabelings: []
  basicAuth: {}
  targetLabels: []


persistence:
  type: pvc
  enabled: false
  # storageClassName: default
  ## (Optional) Use this to bind the claim to an existing PersistentVolume (PV) by name.
  volumeName: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  # annotations: {}
  finalizers:
    - kubernetes.io/pvc-protection
  # selectorLabels: {}
  ## Sub-directory of the PV to mount. Can be templated.
  # subPath: ""
  ## Name of an existing PVC. Can be templated.
  # existingClaim:
  ## Extra labels to apply to a PVC.
  extraPvcLabels: {}
  disableWarning: false
  ## Configure StatefulSet persistent volume claim retention policy.
  ## This is ignored when Grafana is configured to use a Deployment with a PVC.
  ## By default, Kubernetes uses Retain for both whenDeleted and whenScaled.
  persistentVolumeClaimRetentionPolicy: {}
  #  whenDeleted: Retain
  #  whenScaled: Retain

  ## If persistence is not enabled, this allows to mount the
  ## local storage in-memory to improve performance
  ##
  inMemory:
    enabled: false
    ## The maximum usage on memory medium EmptyDir would be
    ## the minimum value between the SizeLimit specified
    ## here and the sum of memory limits of all containers in a pod
    ##
    # sizeLimit: 300Mi

  ## If 'lookupVolumeName' is set to true, Helm will attempt to retrieve
  ## the current value of 'spec.volumeName' and incorporate it into the template.
  lookupVolumeName: true

initChownData:
  ## If false, data ownership will not be reset at startup
  ## This allows the grafana-server to be run with an arbitrary user
  ##
  enabled: true

  ## initChownData container image
  ##
  image:
    # -- The Docker registry
    registry: docker.io
    repository: library/busybox
    tag: "1.38.0"
    sha: ""
    pullPolicy: IfNotPresent

  ## initChownData resource requests and limits
  ## Ref: http://kubernetes.io/docs/user-guide/compute-resources/
  ##
  resources: {}
  #  limits:
  #    cpu: 100m
  #    memory: 128Mi
  #  requests:
  #    cpu: 100m
  #    memory: 128Mi
  securityContext:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      add:
        - CHOWN
        - DAC_OVERRIDE
      drop:
        - ALL

# Administrator credentials when not using an existing secret (see below)
adminUser: admin
adminPassword: temporal


grafana.ini:
  paths:
    data: /var/lib/grafana/
    logs: /var/log/grafana
    plugins: /var/lib/grafana/plugins
    provisioning: /etc/grafana/provisioning
  analytics:
    check_for_updates: true
  log:
    mode: console
  server:
    domain: "{{ if (and .Values.ingress.enabled .Values.ingress.hosts) }}{{ tpl (.Values.ingress.hosts | first) . }}{{ else if (and .Values.route.main.enabled .Values.route.main.hostnames) }}{{ tpl (.Values.route.main.hostnames | first) . }}{{ else }}''{{ end }}"
  unified_storage:
    index_path: /var/lib/grafana-search/bleve


## Add a separate remote image renderer deployment/service
imageRenderer:
  deploymentStrategy: {}
  ## The maximum time in seconds for the image renderer Deployment to make progress before it is
  ## considered to be failed.
  ## ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#progress-deadline-seconds
  progressDeadlineSeconds: null
  # Enable the image-renderer deployment & service
  enabled: false
  replicas: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPU: "60"
    targetMemory: ""
    behavior: {}
  # The url of remote image renderer if it is not in the same namespace with the grafana instance
  serverURL: ""
  # The callback url of grafana instances if it is not in the same namespace with the remote image renderer
  renderingCallbackURL: ""
  # Token used for authentication between Grafana and the remote image renderer.
  token: ""
  # Use an existing secret for the image renderer token. Must contain a key named "token".
  existingSecret: ""
  image:
    # -- The Docker registry
    registry: docker.io
    # image-renderer Image repository
    repository: grafana/grafana-image-renderer
    # image-renderer Image tag
    tag: latest
    # image-renderer Image sha (optional)
    sha: ""
    # image-renderer Image pull secrets (optional)
    pullSecrets: []
    # image-renderer ImagePullPolicy
    pullPolicy: Always
  dnsPolicy: ~
  dnsConfig: {}
    # nameservers:
    #   - 8.8.8.8
    # options:
    # - name: ndots
    #   value: "2"
    # - name: edns0
  # extra environment variables
  env:
    HTTP_HOST: "0.0.0.0"
    # Fixes "Error: Failed to launch the browser process!\nchrome_crashpad_handler: --database is required"
    XDG_CONFIG_HOME: /tmp/.chromium
    XDG_CACHE_HOME: /tmp/.chromium
    # RENDERING_ARGS: --no-sandbox,--disable-gpu,--window-size=1280x758
    # RENDERING_MODE: clustered
    # IGNORE_HTTPS_ERRORS: true

  ## "valueFrom" environment variable references that will be added to deployment pods. Name is templated.
  ## ref: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.19/#envvarsource-v1-core
  ## Renders in container spec as:
  ##   env:
  ##     ...
  ##     - name: <key>
  ##       valueFrom:
  ##         <value rendered as YAML>
  envValueFrom: {}
    #  ENV_NAME:
    #    configMapKeyRef:
    #      name: configmap-name
    #      key: value_key

  # image-renderer deployment serviceAccount
  serviceAccountName: ""
  automountServiceAccountToken: false
  # image-renderer deployment hostUsers
  hostUsers: ~
  # image-renderer deployment securityContext
  securityContext: {}
  # image-renderer deployment container securityContext
  containerSecurityContext:
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop: ['ALL']
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
  ## image-renderer pod annotation
  podAnnotations: {}
  # image-renderer deployment Host Aliases
  hostAliases: []
  # image-renderer deployment priority class
  priorityClassName: ''
  # Path to the healthcheck endpoint. On Image Renderer v5.0.0 or newer, this is '/healthz'. Older versions use '/'.
  healthcheckPath: '/healthz'
  service:
    # Enable the image-renderer service
    enabled: true
    # image-renderer service port name
    portName: 'http'
    # image-renderer service port used by both service and deployment
    port: 8081
    targetPort: 8081
    # Adds the appProtocol field to the image-renderer service. This allows to work with istio protocol selection. Ex: "http" or "tcp"
    appProtocol: ""
  serviceMonitor:
    ## If true, a ServiceMonitor CRD is created for a prometheus operator
    ## https://github.com/coreos/prometheus-operator
    ##
    enabled: false
    path: /metrics
    #  namespace: monitoring  (defaults to use the namespace this chart is deployed to)
    labels: {}
    # Set these to override the Prometheus global scrape interval/timeout.
    # interval: 1m
    # scrapeTimeout: 30s
    scheme: http
    tlsConfig: {}
    relabelings: []
    # See: https://doc.crds.dev/github.com/prometheus-operator/kube-prometheus/monitoring.coreos.com/ServiceMonitor/v1@v0.11.0#spec-targetLabels
    targetLabels: []
      # - targetLabel1
      # - targetLabel2
  # If https is enabled in Grafana, this needs to be set as 'https' to correctly configure the callback used in Grafana
  grafanaProtocol: http
  # In case a sub_path is used this needs to be added to the image renderer callback
  grafanaSubPath: ""
  # name of the image-renderer port on the pod
  podPortName: http
  # number of image-renderer replica sets to keep
  revisionHistoryLimit: 10
  networkPolicy:
    # Enable a NetworkPolicy to limit inbound traffic to only the created grafana pods
    limitIngress: true
    # Enable a NetworkPolicy to limit outbound traffic to only the created grafana pods
    limitEgress: false
    # Allow additional services to access image-renderer (eg. Prometheus operator when ServiceMonitor is enabled)
    extraIngressSelectors: []
  resources: {}
#   limits:
#     cpu: 100m
#     memory: 100Mi
#   requests:
#     cpu: 50m
#     memory: 50Mi
  ## Node labels for pod assignment
  ## ref: https://kubernetes.io/docs/user-guide/node-selection/
  #
  nodeSelector: {}

  ## Tolerations for pod assignment
  ## ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
  ##
  tolerations: []

  ## Affinity for pod assignment (evaluated as template)
  ## ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
  ##
  affinity: {}

  ## Use an alternate scheduler, e.g. "stork".
  ## ref: https://kubernetes.io/docs/tasks/administer-cluster/configure-multiple-schedulers/
  ##
  # schedulerName: "default-scheduler"

  # Extra configmaps to mount in image-renderer pods
  extraConfigmapMounts: []

  # Extra secrets to mount in image-renderer pods
  extraSecretMounts: []

  # Extra volumes to mount in image-renderer pods
  extraVolumeMounts: []

  # Extra volumes for image-renderer pods
  extraVolumes: []

networkPolicy:
  # -- networkPolicy.enabled Enable creation of NetworkPolicy resources. Only Ingress traffic is filtered for now.
  enabled: false
  # --networkPolicy.allowExternal Don't require client label for connections
  # The Policy model to apply. When set to false, only pods with the correct
  # client label will have network access to  grafana port defined.
  # When true, grafana will accept connections from any source
  # (with the correct destination port).
  #
  ingress: true
  # -- networkPolicy.ingress When true enables the creation
  # an ingress network policy
  allowExternal: true
  # -- networkPolicy.explicitNamespacesSelector A Kubernetes LabelSelector to explicitly select namespaces from which traffic could be allowed
  # If explicitNamespacesSelector is missing or set to {}, only client Pods that are in the networkPolicy's namespace
  # and that match other criteria, the ones that have the good label, can reach the grafana.
  # But sometimes, we want the grafana to be accessible to clients from other namespaces, in this case, we can use this
  # LabelSelector to select these namespaces, note that the networkPolicy's namespace should also be explicitly added.
  # </br>
  #
  # Example:
  #
  # ```
  # explicitNamespacesSelector:
  #   matchLabels:
  #     role: frontend
  #   matchExpressions:
  #    - {key: role, operator: In, values: [frontend]}
  # ```
  explicitNamespacesSelector: {}
  # -- networkPolicy.explicitIpBlocks List of CIDR blocks allowed as ingress sources.
  # Each entry must be a valid CIDR notation string (e.g. 10.0.0.0/8).
  # When defined, the specified CIDR ranges are added to the ingress `from` rules
  # using `ipBlock` entries and complement the other configured ingress sources.
  # </br>
  #
  # Example:
  #
  # ```
  # explicitIpBlocks:
  #   - 35.191.0.0/16
  #   - 130.211.0.0/22
  # ```
  #
  explicitIpBlocks: []

  egress:
    # -- networkPolicy.egress.enabled When enabled, an egress network policy will be
    # created allowing grafana to connect to external data sources from kubernetes cluster.
    enabled: false
    # -- networkPolicy.egress.blockDNSResolution When enabled, DNS resolution will be blocked
    # for all pods in the grafana namespace.
    blockDNSResolution: false
    # -- networkPolicy.egress.ports Add individual ports to be allowed by the egress
    ports: []
    # Add ports to the egress by specifying - port: <port number>
    # E.X.
    # - port: 80
    # - port: 443
    #
    # -- networkPolicy.egress.to Allow egress traffic to specific destinations
    to: []
    # -- destinations to the egress by specifying - ipBlock: <CIDR>
    # E.X.
    # to:
    #  - namespaceSelector:
    #    matchExpressions:
    #    - {key: role, operator: In, values: [grafana]}

# Enable backward compatibility of kubernetes where version below 1.13 doesn't have the enableServiceLinks option
enableKubeBackwardCompatibility: false
useStatefulSet: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: TemporalMetrics
        uid: TemporalMetrics
        type: prometheus
        url: http://cluster-1-temporal-prometheus-server.default.svc.cluster.local
        access: proxy
        isDefault: true
